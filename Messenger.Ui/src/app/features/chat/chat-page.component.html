<div class="flex h-full">
  <aside class="flex flex-col w-65 border-r border-gray-300 box-border h-full">
    <div class="flex-auto min-h-0 overflow-auto p-2 flex flex-col gap-2">
      <app-chat-list />
    </div>

    <div class="p-2 border-t border-gray-300 flex justify-end">
      <app-new-chat (navigate)="goToNewChat()" />
    </div>

    <div class="p-2 border-t border-gray-300 flex items-center gap-2">
      <span
        class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-gray-200 text-sm font-medium"
        aria-hidden="true"
      >
        {{ initials() }}
      </span>
      <span class="flex-1 truncate">{{ currentUserName() }}</span>
    </div>
  </aside>

  <main class="flex-auto min-w-0 flex flex-col">
    <router-outlet />
  </main>
</div>
