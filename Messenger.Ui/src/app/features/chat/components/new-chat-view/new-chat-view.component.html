<app-chat-layout>
  <div header class="flex items-center gap-2">
    <label class="flex-1 flex flex-col gap-1">
      <span class="text-xs text-gray-500">New chat name</span>
      <input
        #nameRef
        type="text"
        class="w-full p-1.5 border border-gray-300"
        [value]="name()"
        (input)="onNameInput(nameRef.value)"
        placeholder="New chat name"
      />
    </label>
  </div>

  <ul class="list-none m-0 p-3 flex flex-col gap-1.5">
    @for (contact of selectableContacts(); track contact.id) {
      <li>
        <label class="flex items-center gap-3 px-3 py-2 border border-gray-200 cursor-pointer">
          <input
            type="checkbox"
            [checked]="isSelected(contact.id)"
            (change)="toggleContact(contact.id)"
          />
          <span class="flex-1">{{ contact.name }}</span>
        </label>
      </li>
    } @empty {
      <li class="text-sm text-gray-500 px-3 py-2">No contacts available.</li>
    }
  </ul>

  <div footer class="p-2 border-t border-gray-300">
    <button
      type="button"
      class="w-full px-4 py-2 border border-gray-300 bg-gray-50 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
      [disabled]="creating()"
      (click)="create()"
    >
      {{ creating() ? 'Creating...' : 'Create' }}
    </button>
  </div>
</app-chat-layout>
