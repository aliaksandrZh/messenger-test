<ul class="list-none m-0 p-0 flex flex-col gap-1">
  @for (chat of store.chats(); track chat.id) {
    <li>
      <button
        type="button"
        class="w-full text-left px-3 py-2 border border-gray-200 bg-white cursor-pointer"
        (click)="select(chat)"
      >
        <div class="truncate">{{ chat.name }}</div>
        <div class="text-xs text-gray-400 truncate">No messages</div>
      </button>
    </li>
  }
</ul>
