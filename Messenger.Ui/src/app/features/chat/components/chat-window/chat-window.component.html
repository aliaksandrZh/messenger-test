<app-chat-layout>
  <div header class="flex items-center gap-2">
    <span class="flex-1">{{ chat.header() }}</span>
    <button
      type="button"
      class="px-3 py-1 border border-gray-300 cursor-pointer"
      (click)="chat.toggleInvite()"
    >
      Invite
    </button>
  </div>

  @if (chat.showInvite()) {
    <app-invite-panel />
  }

  <app-message-list />

  <div footer>
    <app-message-input [chatId]="chatId()" />
  </div>
</app-chat-layout>
