<section class="flex flex-col h-full">
  <header class="p-3 border-b border-gray-300 flex items-center gap-2">
    <span class="flex-1">{{ chat.header() }}</span>
    <button
      type="button"
      class="px-3 py-1 border border-gray-300 cursor-pointer"
      (click)="chat.toggleInvite()"
    >
      Invite
    </button>
  </header>

  @if (chat.showInvite()) {
    <app-invite-panel />
  }

  <app-message-list />
  <app-message-input [chatId]="chatId()" />
</section>
