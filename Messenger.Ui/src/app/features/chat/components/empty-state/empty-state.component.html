<div class="flex flex-col items-center justify-center h-full gap-3 p-6 text-center">
  @if (hasChats().length > 0) {
    <span class="text-sm text-gray-500">Loading chat...</span>
  } @else {
    <span class="text-sm text-gray-500">No chats yet.</span>
    <button
      type="button"
      class="px-4 py-2 border border-gray-300 bg-gray-50 cursor-pointer"
      (click)="goToNewChat()"
    >
      Create a new chat
    </button>
  }
</div>
