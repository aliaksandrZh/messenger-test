<section class="flex flex-col h-full p-4 gap-2 overflow-auto">
  <h1 class="text-lg font-semibold">Select your user</h1>
  <ul class="list-none m-0 p-0">
    @for (user of contactsStore.contacts(); track user.id) {
      <li class="py-1">
        <button
          type="button"
          class="w-full text-left px-3 py-2 border border-gray-200 bg-white cursor-pointer"
          (click)="select(user)"
        >
          {{ user.name }}
        </button>
      </li>
    } @empty {
      <li class="py-2 text-gray-500">No users found.</li>
    }
  </ul>
</section>
